name: Weekly Parameter Optimization

# v7: scheduled cron DISABLED.
#
# The optimiser currently maximises composite_score, which production
# data shows is anti-predictive (Pearson r = -0.262 with win, p < 0.0001
# across 239 backsim trades). Every weekly run was therefore drifting
# the champion params in the wrong direction. The most recent runs
# show this — May 3 best WR was 51% vs the historical 68% reality.
#
# Re-enable once Phase 2 (calibrated LR scoring model in agent/score_model.py)
# is in place AND the Optuna objective is switched from "best_score" to
# "model holdout AUC". Until then, manual triggering only.

on:
  # schedule:
  #   - cron: "30 17 * * 0"   # Sunday 11 PM IST — DISABLED in v7
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Number of Optuna trials (default 200)"
        required: false
        default: "200"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python agent/optimize.py
