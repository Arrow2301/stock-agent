name: Weekly Parameter Optimization

# v8: scheduled cron remains DISABLED.
#
# Rationale (carried forward from v7):
#   The historical Optuna objective drifted champion params in the wrong
#   direction. Production data showed best_score had Pearson r = -0.262
#   with realised win (p < 0.0001 across 239 backsim trades).
#
# v8 status:
#   * Optimizer code (agent/optimize.py) is now aligned with the live
#     4-strategy roster (no more Volume Breakout / RSI+MACD / Supertrend
#     in the search space).
#   * Promotion gate is now ×1.10 (was ×1.05) — challengers must beat
#     the champion's objective_score by at least 10% before being eligible.
#
# Re-enable cron only AFTER:
#   1. Phase 3 calibrated LightGBM scorer (agent/score_model.py) is
#      deployed AND its holdout AUC > 0.55 across the next walk-forward
#      window — the existing Phase 2 LR rolled out with AUC 0.553, which
#      isn't trustworthy enough for unattended promotion.
#   2. The optimizer's objective function is changed to maximise
#      model holdout AUC + expectancy, not best_score.
#
# Until then: manual `workflow_dispatch` only.

on:
  # schedule:
  #   - cron: "0 18 * * 0"   # Sunday 11:30 PM IST — DISABLED in v8
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Number of Optuna trials (default 200)"
        required: false
        default: "200"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python agent/optimize.py
